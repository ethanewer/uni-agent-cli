name: Dynamic workflows release gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - workflows
      - workflows-wip-2026-07-19

permissions:
  contents: read

jobs:
  package-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Bootstrap digest-pinned Node/npm
        shell: bash
        run: bash scripts/bootstrap-release-node.sh
      - name: Pack one cross-platform candidate
        env:
          CC_RELEASE_COMMIT: ${{ github.sha }}
        run: |
          shopt -s nocasematch
          while IFS= read -r environment_name; do
            environment_value="${!environment_name-}"
            case "$environment_name" in *KEY*|*TOKEN*|*SECRET*|*PASSWORD*|*CREDENTIAL*|*AUTH*|PAT|PAT_*|*_PAT|*_PAT_*) unset "$environment_name" ;; esac
            case "$environment_name" in [Nn][Pp][Mm]_[Cc][Oo][Nn][Ff][Ii][Gg]_[Uu][Ss][Ee][Rr][Cc][Oo][Nn][Ff][Ii][Gg]|[Nn][Pp][Mm]_[Cc][Oo][Nn][Ff][Ii][Gg]_[Gg][Ll][Oo][Bb][Aa][Ll][Cc][Oo][Nn][Ff][Ii][Gg]) unset "$environment_name" ;; esac
            case "$environment_value" in *://*@*|*://*[?#]*|*$'\r'*|*$'\n'*) unset "$environment_name" ;; esac
          done < <(compgen -e)
          shopt -u nocasematch
          PACK_NPM_CONFIG="$(mktemp -d -t cc-pack-npm-config.XXXXXX)"
          (umask 077; : > "$PACK_NPM_CONFIG/user.npmrc"; : > "$PACK_NPM_CONFIG/global.npmrc")
          export npm_config_userconfig="$PACK_NPM_CONFIG/user.npmrc"
          export npm_config_globalconfig="$PACK_NPM_CONFIG/global.npmrc"
          node scripts/release-workflows.mjs verify-toolchain
          NPM_CLI="$(node -e 'const fs=require("fs"); const path=require("path"); const node=fs.realpathSync(process.execPath); const cli=path.join(path.dirname(path.dirname(node)),"lib/node_modules/npm/bin/npm-cli.js"); if(!fs.statSync(cli).isFile()) throw new Error("npm is not installed beside Node"); process.stdout.write(fs.realpathSync(cli))')"
          export NPM_CLI
          node "$NPM_CLI" pack --ignore-scripts --json > dynamic-workflows-pack.json
          TARBALL="$(node -e 'const fs=require("fs"); const path=require("path"); const packed=JSON.parse(fs.readFileSync("dynamic-workflows-pack.json","utf8")); if(!Array.isArray(packed)||packed.length!==1||typeof packed[0]?.filename!=="string") throw new Error("npm pack must produce exactly one candidate"); const file=path.resolve(packed[0].filename); if(!fs.statSync(file).isFile()) throw new Error("npm pack candidate is not a regular file"); process.stdout.write(file)')"
          (cd "$(dirname "$TARBALL")" && sha256sum "$(basename "$TARBALL")") > "$TARBALL.sha256"
          node -e 'const crypto=require("crypto"); const fs=require("fs"); const path=require("path"); const cp=require("child_process"); const packBytes=fs.readFileSync("dynamic-workflows-pack.json"); const packed=JSON.parse(packBytes); const file=path.resolve(packed[0].filename); const npmCli=fs.realpathSync(process.env.NPM_CLI); const toolchain={nodeVersion:process.versions.node,npmVersion:cp.execFileSync(process.execPath,[npmCli,"--version"],{encoding:"utf8"}).trim(),npmInstallationSha256:"930c1fa35e5525e3b60c584fc3709c7cf71d62134d66fdc88a6e0fe8fc72dc6d"}; const provenance={version:1,commit:process.env.CC_RELEASE_COMMIT,tarball:path.basename(file),sha256:crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex"),name:packed[0].name,packageVersion:packed[0].version,packMetadataSha256:crypto.createHash("sha256").update(packBytes).digest("hex"),toolchain}; if(!/^[0-9a-f]{40}$/u.test(provenance.commit)||typeof provenance.name!=="string"||typeof provenance.packageVersion!=="string"||toolchain.nodeVersion!=="22.19.0"||toolchain.npmVersion!=="10.9.3"||toolchain.npmInstallationSha256!=="930c1fa35e5525e3b60c584fc3709c7cf71d62134d66fdc88a6e0fe8fc72dc6d") throw new Error("candidate provenance is incomplete"); fs.writeFileSync("dynamic-workflows-candidate.json",JSON.stringify(provenance,null,2)+"\n")'
          node scripts/verify-release-candidate.mjs "$PWD" "$GITHUB_SHA" >/dev/null
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: dynamic-workflows-candidate-${{ github.sha }}
          path: |
            dynamic-workflows-pack.json
            dynamic-workflows-candidate.json
            cc-*.tgz
            cc-*.tgz.sha256
          if-no-files-found: error
          retention-days: 30

  disabled-package-smoke:
    needs: package-candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Bootstrap digest-pinned Node/npm
        shell: bash
        run: bash scripts/bootstrap-release-node.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dynamic-workflows-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/cc-candidate
      - name: Select exact npm beside Node
        shell: bash
        run: |
          NPM_CLI="$(node -e 'const fs=require("fs"); const path=require("path"); const node=fs.realpathSync(process.execPath); const root=process.platform==="win32"?path.dirname(node):path.dirname(path.dirname(node)); const cli=path.join(root,process.platform==="win32"?"node_modules":"lib/node_modules","npm/bin/npm-cli.js"); if(!fs.statSync(cli).isFile()) throw new Error("npm is not installed beside Node"); process.stdout.write(fs.realpathSync(cli))')"
          echo "CC_RELEASE_NPM_CLI=$NPM_CLI" >> "$GITHUB_ENV"
          node scripts/release-workflows.mjs verify-toolchain
      - name: Verify and select exact candidate
        shell: bash
        run: |
          TARBALL="$(node scripts/verify-release-candidate.mjs "$RUNNER_TEMP/cc-candidate" "$GITHUB_SHA")"
          echo "CC_WORKFLOW_E2E_TARBALL=$TARBALL" >> "$GITHUB_ENV"
      - shell: bash
        run: node "$CC_RELEASE_NPM_CLI" ci --include=optional --ignore-scripts
      - run: node node_modules/opencode-ai/postinstall.mjs
      - run: node scripts/postinstall.mjs
      - name: Cross-platform installer regressions
        run: node tests/postinstall.test.mjs && node tests/channel_installer.test.mjs
      - name: Linux ordinary suite
        if: runner.os == 'Linux'
        run: node "$CC_RELEASE_NPM_CLI" test
      - name: Clean tarball install and POSIX bin smoke
        if: runner.os == 'Linux'
        run: node "$CC_RELEASE_NPM_CLI" run test:package:install
      - name: Clean tarball install and Windows cmd shim smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tarball = $env:CC_WORKFLOW_E2E_TARBALL
          $prefix = Join-Path $env:RUNNER_TEMP "cc-package-windows"
          Get-ChildItem Env: | ForEach-Object {
            if ($_.Name -match '(?i)(key|token|secret|password|credential|auth)' -or
                $_.Name -match '(?i)(^|_)PAT(_|$)' -or
                $_.Name -match '(?i)^npm_config_(userconfig|globalconfig)$' -or
                $_.Value -match '[\r\n]' -or
                $_.Value -match '(?is)[a-z][a-z0-9+.-]*://.*(@|\?|#)') {
              Remove-Item ("Env:" + $_.Name)
            }
          }
          $configRoot = Join-Path $env:RUNNER_TEMP "cc-empty-npm-config"
          New-Item -ItemType Directory -Force $configRoot | Out-Null
          $env:npm_config_userconfig = Join-Path $configRoot "user.npmrc"
          $env:npm_config_globalconfig = Join-Path $configRoot "global.npmrc"
          Set-Content -NoNewline $env:npm_config_userconfig ""
          Set-Content -NoNewline $env:npm_config_globalconfig ""
          Remove-Item Env:npm_config_omit, Env:NPM_CONFIG_OMIT, Env:npm_config_optional, Env:NPM_CONFIG_OPTIONAL -ErrorAction SilentlyContinue
          & node $env:CC_RELEASE_NPM_CLI install --no-audit --no-fund --include=optional --foreground-scripts --dangerously-allow-all-scripts --prefix $prefix $tarball
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $shim = Join-Path $prefix "node_modules/.bin/cc.cmd"
          & $shim --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installed = Join-Path $prefix "node_modules/cc"
          if (-not (Test-Path (Join-Path $installed "src/workflows/manager.mjs"))) { throw "workflow runtime missing from Windows artifact" }
          $postinstallPath = (Resolve-Path (Join-Path $installed "scripts/postinstall.mjs")).Path
          $postinstallUri = ([System.Uri]::new($postinstallPath)).AbsoluteUri
          node --input-type=module --eval 'const m=await import(process.argv[1]); const failed=m.verifyPostinstall({report:false}).filter((entry)=>!entry.ok); if(failed.length) throw new Error("installed native verification failed: "+JSON.stringify(failed));' $postinstallUri
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check (Join-Path $installed "src/workflows/manager.mjs")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $piPath = (Resolve-Path (Join-Path $installed "src/pi-harness.mjs")).Path
          $piUri = ([System.Uri]::new($piPath)).AbsoluteUri
          node --input-type=module --eval 'const fs=await import("node:fs/promises"); const m=await import(process.argv[1]); if(m.resolveWorkflowMode({workflowMode:"flexible"},{},process.platform)!=="disabled") throw new Error("persisted workflow opt-in was not forced Disabled on Windows"); const source=await fs.readFile(process.argv[2],"utf8"); if(/^import .*\.\/workflows\//mu.test(source)) throw new Error("Disabled startup statically imports workflow components");' $piUri $piPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  dynamic-workflows-release:
    needs: package-candidate
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Bootstrap digest-pinned Node/npm
        shell: bash
        run: bash scripts/bootstrap-release-node.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dynamic-workflows-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/cc-candidate
      - name: Select exact npm beside Node
        run: |
          NPM_CLI="$(node -e 'const fs=require("fs"); const path=require("path"); const node=fs.realpathSync(process.execPath); const cli=path.join(path.dirname(path.dirname(node)),"lib/node_modules/npm/bin/npm-cli.js"); if(!fs.statSync(cli).isFile()) throw new Error("npm is not installed beside Node"); process.stdout.write(fs.realpathSync(cli))')"
          echo "CC_RELEASE_NPM_CLI=$NPM_CLI" >> "$GITHUB_ENV"
          node scripts/release-workflows.mjs verify-toolchain
      - name: Verify and select exact candidate
        run: |
          TARBALL="$(node scripts/verify-release-candidate.mjs "$RUNNER_TEMP/cc-candidate" "$GITHUB_SHA")"
          echo "CC_WORKFLOW_E2E_TARBALL=$TARBALL" >> "$GITHUB_ENV"
      - name: Build digest-pinned tmux
        run: bash scripts/install-pinned-tmux.sh
      - run: node "$CC_RELEASE_NPM_CLI" ci --include=optional --ignore-scripts
      - run: node node_modules/opencode-ai/postinstall.mjs
      - run: node scripts/postinstall.mjs
      - name: Run deterministic installed-artifact release gate
        env:
          CC_RELEASE_COMMIT: ${{ github.sha }}
          CC_WORKFLOW_RELEASE_DIR: ${{ runner.temp }}/cc-deterministic-release
        run: node "$CC_RELEASE_NPM_CLI" run test:release
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: dynamic-workflows-deterministic-release-${{ github.sha }}
          path: ${{ runner.temp }}/cc-deterministic-release
          if-no-files-found: warn
          retention-days: 30

  authenticated-live-release:
    needs: [package-candidate, disabled-package-smoke, dynamic-workflows-release]
    if: >-
      always() &&
      needs.package-candidate.result == 'success' &&
      needs.disabled-package-smoke.result == 'success' &&
      needs.dynamic-workflows-release.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/workflows' || github.ref == 'refs/heads/workflows-wip-2026-07-19')
    uses: ./.github/workflows/dynamic-workflows-live-release.yml

  dynamic-workflows-final-release:
    needs: [package-candidate, disabled-package-smoke, dynamic-workflows-release, authenticated-live-release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable protected release gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PACKAGE_RESULT: ${{ needs.package-candidate.result }}
          DISABLED_RESULT: ${{ needs.disabled-package-smoke.result }}
          DETERMINISTIC_RESULT: ${{ needs.dynamic-workflows-release.result }}
          AUTHENTICATED_RESULT: ${{ needs.authenticated-live-release.result }}
        run: |
          node -e 'const required=[["package-candidate",process.env.PACKAGE_RESULT],["disabled-package-smoke",process.env.DISABLED_RESULT],["dynamic-workflows-release",process.env.DETERMINISTIC_RESULT]]; const liveRequired=["push","workflow_dispatch"].includes(process.env.EVENT_NAME); required.push(["authenticated-live-release",process.env.AUTHENTICATED_RESULT]); const failed=required.filter(([name,result])=>name==="authenticated-live-release"&&!liveRequired?result!=="skipped":result!=="success"); if(failed.length) throw new Error("release gates did not all succeed: "+failed.map(([name,result])=>name+"="+result).join(", "));'
